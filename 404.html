<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Page Not Found – Shrikaa</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" /><link rel="stylesheet" href="assets/css/components.css" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }

    .e404 {
      min-height: 100vh;
      background: var(--charcoal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: var(--sp-12) var(--sp-6);
    }

    /* subtle dot-grid (same as hero) */
    .e404::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.5;
    }

    /* faint mandala texture */
    .e404__mandala {
      position: absolute;
      width: 580px; height: 580px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.04;
      background-image: url('assets/images/logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: invert(1);
    }

    /* giant ghost "404" text */
    .e404__ghost {
      position: absolute;
      font-family: var(--font-display);
      font-size: clamp(9rem, 28vw, 18rem);
      font-weight: 400;
      line-height: 1;
      color: rgba(255,255,255,0.055);
      letter-spacing: -0.04em;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* content layer */
    .e404__body {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 560px;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .e404__pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.35em 1em;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: var(--sp-6);
    }
    .e404__pill::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      flex-shrink: 0;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }

    .e404__heading {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 400;
      color: var(--white);
      line-height: 1.2;
      margin: 0 0 var(--sp-4);
    }
    .e404__heading em {
      font-style: italic;
      color: rgba(255,255,255,0.45);
    }

    .e404__sub {
      font-size: var(--text-base);
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      margin: 0 0 var(--sp-8);
    }

    .e404__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-3);
      justify-content: center;
      margin-bottom: var(--sp-8);
    }

    /* override btn colours for dark bg */
    .e404 .btn--primary {
      background: var(--white);
      color: var(--charcoal);
      border-color: var(--white);
    }
    .e404 .btn--primary:hover {
      background: var(--chalk);
      border-color: var(--chalk);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .e404 .btn--ghost {
      color: rgba(255,255,255,0.55);
      border-color: rgba(255,255,255,0.18);
    }
    .e404 .btn--ghost:hover {
      color: var(--white);
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.35);
    }

    .e404__divider {
      width: 40px; height: 1px;
      background: rgba(255,255,255,0.12);
      margin: 0 auto var(--sp-6);
    }

    .e404__help {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.3);
    }
    .e404__help a {
      color: rgba(255,255,255,0.65);
      font-weight: 600;
      text-decoration: none;
      transition: color var(--dur) var(--ease);
    }
    .e404__help a:hover { color: var(--white); }
  </style>
</head>
<body>
  <div class="e404">
    <div class="e404__mandala" aria-hidden="true"></div>
    <div class="e404__ghost" aria-hidden="true">404</div>

    <div class="e404__body">
      <div class="e404__pill">Page Not Found</div>

      <h1 class="e404__heading">
        This page <em>doesn&rsquo;t exist.</em>
      </h1>

      <p class="e404__sub">
        The page you&rsquo;re looking for may have been moved, renamed, or<br>
        removed. Let&rsquo;s get you back on track.
      </p>

      <nav class="e404__actions" aria-label="Navigate to key sections">
        <a href="index.html" class="btn btn--primary btn--lg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Go Home
        </a>
        <a href="academics.html" class="btn btn--ghost btn--lg">Courses</a>
        <a href="contact.html"   class="btn btn--ghost btn--lg">Contact</a>
      </nav>

      <div class="e404__divider"></div>

      <p class="e404__help">
        Need help? Call us at
        <a href="tel:7026386563">7026386563</a>
      </p>
    </div>
  </div>
</body>
</html>
